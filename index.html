<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opex House · Parcours de formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Couleurs Opex House : remplacez ces valeurs par vos codes exacts */
  --brand:#0e2a47;      /* bleu marine principal */
  --brand-2:#163b63;    /* marine clair */
  --accent:#c8912e;     /* or / accent */
  --accent-soft:#f7efe0;
  --ink:#1b2430; --muted:#5d6878; --line:#e3e7ec; --bg:#f5f7fa; --white:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e6f4ec; --bad:#b42318; --bad-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff4e0;
  --head:"Montserrat",Arial,sans-serif; --sans:"Source Sans 3","Segoe UI",Arial,sans-serif; --mono:"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
[hidden]{display:none!important}
.topbar{background:var(--white);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--brand)}
.logo img{height:40px;width:auto;display:block}
.logo .wm{font:800 20px var(--head);letter-spacing:.06em;text-transform:uppercase}
.who{font:600 14px var(--sans);color:var(--muted);display:flex;gap:8px;align-items:center}
.hero{background:var(--brand);color:#fff}
.hero .in{max-width:1080px;margin:0 auto;padding:40px 20px 34px}
.hero .kicker{font:700 12px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:800 clamp(28px,4.4vw,40px)/1.15 var(--head);margin:10px 0 10px;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;max-width:60ch;color:#d7e1ec;font-size:17px}
nav.tabs{background:var(--brand-2);display:flex;gap:0;overflow-x:auto;position:sticky;top:0;z-index:5}
nav.tabs .in{max-width:1080px;margin:0 auto;display:flex;width:100%;padding:0 12px}
nav.tabs button{font:600 14px var(--head);color:#c9d5e3;background:none;border:0;border-bottom:3px solid transparent;padding:14px 16px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px}
#notice:empty{display:none}
.notice{border-left:4px solid var(--brand);background:var(--white);padding:12px 16px;margin-top:20px;font-size:15px}
.notice.warn{border-left-color:var(--accent);background:var(--accent-soft)}
section.view{padding-top:32px;display:grid;gap:20px}
.eyebrow{font:700 12px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h2{font:800 26px/1.2 var(--head);color:var(--brand);margin:6px 0 6px;text-wrap:balance}
h3{font:700 17px/1.3 var(--head);color:var(--brand);margin:0}
.lead{margin:0;max-width:70ch;color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:22px 24px;display:grid;gap:14px}
.card .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--brand)}
.enonce{max-width:74ch;display:grid;gap:8px}.enonce p{margin:0}.enonce ul{margin:0;padding-left:20px}
.q{display:grid;grid-template-columns:1fr minmax(160px,230px);gap:8px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q.long{grid-template-columns:1fr}
.q label{font-size:15px}
.pts{color:var(--muted);font-size:12px;margin-left:8px;white-space:nowrap;font-family:var(--head)}
input.num,input.txt,select,textarea{font:15px var(--sans);width:100%;padding:10px 12px;border:1px solid #cfd6de;border-radius:3px;background:#fff;color:var(--ink)}
input.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
textarea{min-height:100px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.q.good input,.q.good select{border-color:var(--ok);background:var(--ok-soft)}
.q.wrong input,.q.wrong select{border-color:var(--bad);background:var(--bad-soft)}
.fb{grid-column:1/-1;font-size:14px;font-weight:600}.fb.good{color:var(--ok)}.fb.wrong{color:var(--bad)}
.corrige{border-left:4px solid var(--accent);background:var(--accent-soft);padding:14px 16px;font-size:15px}
.corrige p{margin:0 0 6px}.corrige p:last-child{margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn,a.btn{display:inline-block;text-decoration:none;font:700 14px var(--head);letter-spacing:.03em;border-radius:3px;padding:11px 20px;cursor:pointer;border:2px solid var(--brand);background:var(--brand);color:#fff}
.btn:hover,a.btn:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand);color:#fff}
.btn:disabled,a.btn.disabled{opacity:.5;pointer-events:none}
.score{font:700 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stat{align-content:start}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--brand)}
tbody tr:nth-child(even) td{background:#fafbfc}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:14px}
.small.good{color:var(--ok)}.small.bad{color:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:2px;font:700 11px var(--head);letter-spacing:.08em;text-transform:uppercase;background:#eef1f5;color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--accent-soft);color:#7a5412}
.field{display:grid;gap:6px;font:600 13px var(--head);color:var(--brand);letter-spacing:.02em}
.card.send{border:2px solid var(--accent);background:var(--accent-soft)}
a{color:var(--brand-2)}
.steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.step{display:flex;align-items:center;gap:10px;font:700 14px var(--head);color:var(--brand);background:var(--white);border:1px solid var(--line);border-radius:3px;padding:10px 16px;cursor:pointer}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
.step:hover{border-color:var(--brand)}
.sechead{padding-top:12px;scroll-margin-top:70px}
[id^="lecon-"],[id^="cert-"]{scroll-margin-top:70px}
.bar{height:6px;background:#e9edf2;border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.lesson details.sec{border:1px solid var(--line);border-radius:3px;background:#fff}
.lesson details.sec+details.sec{margin-top:-4px}
.lesson summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 16px;font:700 16px var(--head);color:var(--brand)}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
.lesson details[open] summary::after{content:"–"}
.lesson summary .num{font:700 13px var(--mono);color:var(--accent)}
.lesson details.done summary .num::after{content:" ✓";color:var(--ok)}
.lesson .body{padding:0 16px 8px;max-width:78ch;display:grid;gap:10px}
.lesson .body p,.lesson .body ul,.lesson .body ol{margin:0}
.lesson .body table{margin:4px 0;display:block;overflow-x:auto}
.lesson .body .tblw{overflow-x:auto}
.card.lesson>.body{padding:0}
.readmark{display:flex;gap:10px;align-items:center;margin:4px 16px 16px;padding-top:12px;border-top:1px solid var(--line);font:600 14px var(--head);color:var(--brand);cursor:pointer}
.readmark input{width:18px;height:18px;accent-color:var(--brand)}
ol.plan{margin:0;padding-left:20px;display:grid;gap:8px}
footer.foot{border-top:1px solid var(--line);background:var(--white)}
footer.foot .in{max-width:1080px;margin:0 auto;padding:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
@media (max-width:600px){.q{grid-template-columns:1fr}.card{padding:18px 16px}.hero .in{padding:28px 20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

r les faits et faire valider par le CPA avant la paie"}],"pts":6,"comp":"Province d'emploi"},{"id":"g14","label":"Sofia habite Toronto. Elle travaille à la succursale de Toronto 3 jours par semaine et au siège de Montréal 2 jours par semaine.","type":"choice","options":[{"v":"q","t":"Impôt du Québec, RRQ, RQAP, AE au taux du Québec ; T4 et RL-1"},{"v":"o","t":"Impôt de l'Ontario, RPC, AE hors Québec, pas de RQAP ; T4 seulement"},{"v":"cpa","t":"Cas mixte : documenter les faits et faire valider par le CPA avant la paie"}],"pts":6,"comp":"Province d'emploi"}]}]};
