const M4E={"id":"m4e","titre":"M4 — Entraînement","mode":"train","exercices":[{"id":"m4e1","titre":"Exercice 1 — Facture","enonce":"<p>Un cabinet québécois facture 1 250 $ d'honoraires à un client de Laval.</p>","questions":[{"id":"a","label":"TPS ($)","type":"num","answer":62.5,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"b","label":"TVQ ($)","type":"num","answer":124.69,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"c","label":"Total de la facture ($)","type":"num","answer":1437.19,"pts":1,"comp":"Calcul des taxes","tol":0.005}],"corrige":"<p>TPS 1 250 × 5 % = 62,50 $ ; TVQ 1 250 × 9,975 % = 124,69 $ ; total 1 437,19 $. Chaque taxe se calcule sur le hors-taxe.</p>"},{"id":"m4e2","titre":"Exercice 2 — Retrouver les taxes","enonce":"<p>Un reçu indique 229,95 $ taxes comprises, sans détail.</p>","questions":[{"id":"a","label":"Montant hors taxes ($)","type":"num","answer":200,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"b","label":"TPS ($)","type":"num","answer":10,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"c","label":"TVQ ($)","type":"num","answer":19.95,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"d","label":"Ce reçu suffit-il pour réclamer un CTI/RTI ?","type":"choice","options":[{"v":"oui","t":"Oui"},{"v":"non","t":"Non"}],"answer":"non","pts":1,"comp":"Pièces justificatives"}],"corrige":"<p>229,95 ÷ 1,14975 = 200,00 $ ; TPS 10,00 $ ; TVQ 19,95 $. Au-delà de 100 $, il faut le montant de chaque taxe et les numéros TPS/TVQ du fournisseur : demandez une facture complète.</p>"},{"id":"m4e3","titre":"Exercice 3 — Classement","enonce":"<p>Taxable, détaxé ou exonéré ?</p>","questions":[{"id":"a","label":"Loyer d'un appartement à l'année","type":"choice","options":[{"v":"tax","t":"Taxable"},{"v":"det","t":"Détaxé"},{"v":"exo","t":"Exonéré"}],"answer":"exo","pts":1,"comp":"Classification"},{"id":"b","label":"Loyer d'un bureau","type":"choice","options":[{"v":"tax","t":"Taxable"},{"v":"det","t":"Détaxé"},{"v":"exo","t":"Exonéré"}],"answer":"tax","pts":1,"comp":"Classification"},{"id":"c","label":"Frais bancaires mensuels","type":"choice","options":[{"v":"tax","t":"Taxable"},{"v":"det","t":"Détaxé"},{"v":"exo","t":"Exonéré"}],"answer":"exo","pts":1,"comp":"Classification"},{"id":"d","label":"Panier d'épicerie de base","type":"choice","options":[{"v":"tax","t":"Taxable"},{"v":"det","t":"Détaxé"},{"v":"exo","t":"Exonéré"}],"answer":"det","pts":1,"comp":"Classification"},{"id":"e","label":"Vente de machines à un client en France","type":"choice","options":[{"v":"tax","t":"Taxable"},{"v":"det","t":"Détaxé"},{"v":"exo","t":"Exonéré"}],"answer":"det","pts":1,"comp":"Classification"},{"id":"f","label":"Repas d'affaires au restaurant","type":"choice","options":[{"v":"tax","t":"Taxable"},{"v":"det","t":"Détaxé"},{"v":"exo","t":"Exonéré"}],"answer":"tax","pts":1,"comp":"Classification"}],"corrige":"<p>(a) exonéré ; (b) taxable ; (c) exonéré, service financier ; (d) détaxé ; (e) détaxé, exportation ; (f) taxable, avec récupération limitée en règle générale à 50 %.</p>"},{"id":"m4e4","titre":"Exercice 4 — Pièces justificatives","enonce":"<p>Le CTI/RTI est-il justifié ?</p>","questions":[{"id":"a","label":"350 $ taxes comprises, sans numéros TPS/TVQ du fournisseur","type":"choice","options":[{"v":"o1","t":"Oui, CTI et RTI justifiés"},{"v":"o2","t":"Non : il manque les numéros TPS/TVQ du fournisseur"},{"v":"o3","t":"Non : la facture doit être au nom de l'entité qui réclame"},{"v":"o4","t":"TPS oui ; TVQ non sans montant de TVQ ni description"}],"answer":"o2","pts":1,"comp":"Pièces justificatives"},{"id":"b","label":"620 $ taxes comprises, au nom de « Marc Roy » alors que le client est « Toitures Roy inc. »","type":"choice","options":[{"v":"o1","t":"Oui, CTI et RTI justifiés"},{"v":"o2","t":"Non : il manque les numéros TPS/TVQ du fournisseur"},{"v":"o3","t":"Non : la facture doit être au nom de l'entité qui réclame"},{"v":"o4","t":"TPS oui ; TVQ non sans montant de TVQ ni description"}],"answer":"o3","pts":1,"comp":"Pièces justificatives"},{"id":"c","label":"45 $ au dépanneur : nom du commerce, date et total seulement","type":"choice","options":[{"v":"o1","t":"Oui, CTI et RTI justifiés"},{"v":"o2","t":"Non : il manque les numéros TPS/TVQ du fournisseur"},{"v":"o3","t":"Non : la facture doit être au nom de l'entité qui réclame"},{"v":"o4","t":"TPS oui ; TVQ non sans montant de TVQ ni description"}],"answer":"o4","pts":1,"comp":"Pièces justificatives"}],"corrige":"<p>(a) Numéros obligatoires dès 100 $. (b) À partir de 500 $, nom de l'acheteur exigé : faire refaire la facture au nom de la société et signaler au CPA si la dépense peut être personnelle. (c) Sous 100 $ : suffisant pour la TPS ; pour la TVQ il faut aussi le montant de TVQ et une description.</p>"},{"id":"m4e6","titre":"Exercice 6 — Méthode rapide","enonce":"<p>Une entreprise de nettoyage admissible (taux des services) fait 18 000 $ de ventes taxables hors taxes au premier trimestre de son exercice.</p>","questions":[{"id":"a","label":"TPS à remettre, après le crédit de 1 % ($)","type":"num","answer":491.4,"pts":1,"comp":"Méthode rapide","tol":0.005},{"id":"b","label":"TVQ à remettre, après le crédit de 1 % ($)","type":"num","answer":1108.54,"pts":1,"comp":"Méthode rapide","tol":0.005},{"id":"c","label":"Un cabinet de tenue de livres peut-il utiliser la méthode rapide ?","type":"choice","options":[{"v":"oui","t":"Oui, sous 400 000 $ de ventes"},{"v":"non","t":"Non, jamais"}],"answer":"non","pts":1,"comp":"Méthode rapide"}],"corrige":"<p>18 900 $ × 3,6 % = 680,40 $, moins 189,00 $ = 491,40 $. 19 795,50 $ × 6,6 % = 1 306,50 $, moins 197,96 $ = 1 108,54 $. Les taux s'appliquent aux ventes taxes comprises. Services comptables, juridiques, de tenue de livres ou de préparation de déclarations : exclus de la méthode rapide.</p>"},{"id":"m4e7","titre":"Exercice 7 — Remboursement et échéance","enonce":"<p>L'employeur rembourse 520 $ de dépenses engagées au Québec, taxes comprises, à une employée. Et une question de calendrier.</p>","questions":[{"id":"a","label":"CTI par la méthode factorielle ($)","type":"num","answer":20,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"b","label":"RTI par la méthode factorielle ($)","type":"num","answer":42.94,"pts":1,"comp":"Calcul des taxes","tol":0.005},{"id":"c","label":"Date limite de la déclaration trimestrielle juillet–septembre 2026","type":"choice","options":[{"v":"a","t":"Samedi 31 octobre 2026"},{"v":"b","t":"Lundi 2 novembre 2026"},{"v":"c","t":"Lundi 16 novembre 2026"},{"v":"d","t":"Lundi 30 novembre 2026"}],"answer":"b","pts":1,"comp":"Échéances"}],"corrige":"<p>CTI = 520 × 4/104 = 20,00 $ ; RTI = 520 × 9/109 = 42,94 $. Le 31 octobre 2026 est un samedi : l'échéance passe au lundi 2 novembre.</p>"}]};
const M5E={"id":"m5e","titre":"M5 — Entraînement","mode":"train","exercices":[{"id":"m5e1","titre":"Exercice 1 — Une paie","enonce":"<p>Employée à Montréal, payée aux deux semaines (26 paies), 2 400 $ bruts, première paie de 2026. Masse salariale de 800 000 $, services. Taux CNESST de l'unité : 0,85 %. Impôts fournis (fictifs) : Québec 290,00 $, fédéral 160,00 $.</p>","questions":[{"id":"a","label":"RRQ de l'employée ($)","type":"num","answer":142.72,"pts":1,"comp":"Cotisations","tol":0.005},{"id":"b","label":"RQAP de l'employée ($)","type":"num","answer":10.32,"pts":1,"comp":"Cotisations","tol":0.005},{"id":"c","label":"AE de l'employée ($)","type":"num","answer":31.2,"pts":1,"comp":"Cotisations","tol":0.005},{"id":"d","label":"Salaire net ($)","type":"num","answer":1765.76,"pts":1,"comp":"Cotisations","tol":0.005},{"id":"e","label":"Remise à Revenu Québec ($)","type":"num","answer":660.21,"pts":1,"comp":"Remises","tol":0.005},{"id":"f","label":"Remise à l'ARC ($)","type":"num","answer":234.88,"pts":1,"comp":"Remises","tol":0.005},{"id":"g","label":"Coût total de l'employeur, CNT comprise ($)","type":"num","answer":262.29,"pts":1,"comp":"Cotisations","tol":0.005}],"corrige":"<p>RRQ (2 400 − 134,62) × 6,30 % = 142,72 $ ; RQAP 10,32 $ (employeur 14,45 $) ; AE 31,20 $ (employeur 43,68 $). Net 1 765,76 $. Revenu Québec : 290,00 + 285,44 + 24,77 + 39,60 + 20,40 = 660,21 $. ARC : 160,00 + 31,20 + 43,68 = 234,88 $. Coût employeur : 142,72 + 14,45 + 43,68 + 39,60 + 20,40 + 1,44 = 262,29 $ ; la CNT (1,44 $) se paie une fois par an avec le Sommaire 1.</p>"},{"id":"m5e2","titre":"Exercice 2 — Plafonds","enonce":"<p>Salarié à 90 000 $ par an : 25 paies de 3 461,54 $, puis une 26e paie ajustée pour que le total annuel soit exactement 90 000 $.</p>","questions":[{"id":"a","label":"À quelle paie l'AE est-elle retenue pour la dernière fois ?","type":"choice","options":[{"v":"19","t":"19e"},{"v":"20","t":"20e"},{"v":"21","t":"21e"},{"v":"22","t":"22e"}],"answer":"20","pts":1,"comp":"Plafonds"},{"id":"b","label":"Cotisation AE de cette paie ($)","type":"num","answer":40.7,"pts":1,"comp":"Plafonds","tol":0.005},{"id":"c","label":"2e cotisation supplémentaire RRQ à la 22e paie ($)","type":"num","answer":62.16,"pts":1,"comp":"Plafonds","tol":0.005},{"id":"d","label":"Quand le RQAP s'arrête-t-il ?","type":"choice","options":[{"v":"22","t":"À la 22e paie"},{"v":"25","t":"À la 25e paie"},{"v":"jamais","t":"Jamais dans l'année"}],"answer":"jamais","pts":1,"comp":"Plafonds"}],"corrige":"<p>Après 19 paies, cumul de 65 769,26 $ ; il reste 3 130,74 $ assurables, donc 40,70 $ à la 20e paie. Après 22 paies, cumul de 76 153,88 $ : 1 553,88 $ dépassent 74 600 $, soit 62,16 $ de 2e supplémentaire. Ensuite 138,46 $ aux 23e et 24e paies et 76,92 $ à la 25e : total exact de 416,00 $. RQAP : 90 000 × 0,430 % = 387 $, sous le maximum de 442,90 $.</p>"},{"id":"m5e3","titre":"Exercice 3 — FSS","enonce":"<p>Employeur de services (ni primaire, ni manufacturier, ni public), masse salariale totale de 3 000 000 $.</p>","questions":[{"id":"a","label":"Taux de FSS arrondi (%)","type":"num","answer":2.42,"pts":1,"comp":"Cotisations","tol":0.005},{"id":"b","label":"La participation de 1 % à la formation s'applique-t-elle ?","type":"choice","options":[{"v":"oui","t":"Oui"},{"v":"non","t":"Non"}],"answer":"oui","pts":1,"comp":"Fin d'année"}],"corrige":"<p>1,2662 + 0,3838 × 3 = 2,4176, soit 2,42 %. La masse salariale dépasse 2 M$ : la participation de 1 % s'applique, via le Sommaire 1.</p>"},{"id":"m5e4","titre":"Exercice 4 — Normes du travail","enonce":"<p>(a) et (b) : salariée ayant gagné 48 000 $ brut dans l'année de référence. (c) Salarié ayant gagné 4 000 $ dans les 4 semaines complètes avant la semaine d'un jour férié.</p>","questions":[{"id":"a","label":"Indemnité de vacances avec 2 ans de service ($)","type":"num","answer":1920,"pts":1,"comp":"Normes du travail","tol":0.005},{"id":"b","label":"Indemnité de vacances avec 3 ans de service ($)","type":"num","answer":2880,"pts":1,"comp":"Normes du travail","tol":0.005},{"id":"c","label":"Indemnité du jour férié ($)","type":"num","answer":200,"pts":1,"comp":"Normes du travail","tol":0.005}],"corrige":"<p>4 % × 48 000 = 1 920 $ ; 6 % × 48 000 = 2 880 $ ; 4 000 ÷ 20 = 200 $.</p>"},{"id":"m5e5","titre":"Exercice 5 — Fin d'année","enonce":"<p>Client avec 8 employés en 2026 ; l'employeur paie 1 200 $ par employé de primes d'un régime privé d'assurance maladie.</p>","questions":[{"id":"a","label":"Date limite des T4 et RL-1 de 2026","type":"choice","options":[{"v":"a","t":"Vendredi 26 février 2027"},{"v":"b","t":"Dimanche 28 février 2027"},{"v":"c","t":"Lundi 1er mars 2027"},{"v":"d","t":"Mercredi 31 mars 2027"}],"answer":"c","pts":1,"comp":"Fin d'année"},{"id":"b","label":"Mode de transmission","type":"choice","options":[{"v":"a","t":"Papier permis"},{"v":"b","t":"Transmission électronique obligatoire"}],"answer":"b","pts":1,"comp":"Fin d'année"},{"id":"c","label":"Traitement des 1 200 $","type":"choice","options":[{"v":"a","t":"Case 14 du T4 et case A du RL-1"},{"v":"b","t":"Case A et case J du RL-1, rien au T4"},{"v":"c","t":"Nulle part, ce n'est pas imposable"}],"answer":"b","pts":1,"comp":"Fin d'année"}],"corrige":"<p>Le 28 février 2027 est un dimanche : date limite le lundi 1er mars. Plus de 5 relevés : transmission électronique. Avantage imposable au Québec seulement : cases A et J du RL-1, absent du T4.</p>"}]};
const M6E={"id":"m6e","titre":"M6 — Entraînement","mode":"train","exercices":[{"id":"m6e1","titre":"Exercice 1 — Coupure","enonce":"<p>Exercice clos le 31 décembre 2026. Une facture d'entretien de décembre, 2 300 $ hors taxes, arrive le 8 janvier 2027.</p>","questions":[{"id":"a","label":"Écriture au 31 décembre","type":"choice","options":[{"v":"a","t":"Aucune : la facture est de 2027"},{"v":"b","t":"Débit Entretien / Crédit Charges à payer"},{"v":"c","t":"Débit Charges payées d'avance / Crédit Entretien"}],"answer":"b","pts":1,"comp":"Écritures de fin d'exercice"},{"id":"b","label":"Montant ($)","type":"num","answer":2300,"pts":1,"comp":"Écritures de fin d'exercice","tol":0.005}],"corrige":"<p>La dépense appartient à 2026 : Débit Entretien 2 300 $ / Crédit Charges à payer 2 300 $.</p>"},{"id":"m6e2","titre":"Exercice 2 — Payé d'avance","enonce":"<p>Assurance annuelle de 3 600 $ payée le 1er septembre 2026 et portée en charge.</p>","questions":[{"id":"a","label":"Charge payée d'avance au 31 décembre ($)","type":"num","answer":2400,"pts":1,"comp":"Écritures de fin d'exercice","tol":0.005}],"corrige":"<p>8 mois sur 12 restent à courir : 3 600 × 8/12 = 2 400 $.</p>"},{"id":"m6e3","titre":"Exercice 3 — Conciliation fiscale","enonce":"<p>Bénéfice comptable 120 000 $ ; amortissement comptable 18 000 $ ; DPA 25 000 $ ; repas 4 000 $ ; amende 500 $.</p>","questions":[{"id":"a","label":"Revenu fiscal ($)","type":"num","answer":115500,"pts":1,"comp":"Conciliation fiscale","tol":0.005}],"corrige":"<p>120 000 + 18 000 − 25 000 + 2 000 (50 % des repas) + 500 = 115 500 $.</p>"},{"id":"m6e4","titre":"Exercice 4 — Impôt des sociétés","enonce":"<p>Revenu fiscal de 115 500 $, admissible en entier à la déduction pour petite entreprise aux deux paliers, exercice du 1er janvier au 31 décembre 2026.</p>","questions":[{"id":"a","label":"Impôt fédéral ($)","type":"num","answer":10395,"pts":1,"comp":"Impôt des sociétés","tol":0.005},{"id":"b","label":"Impôt du Québec ($)","type":"num","answer":3696,"pts":1,"comp":"Impôt des sociétés","tol":0.005}],"corrige":"<p>Fédéral 9 % : 10 395 $. Québec 3,2 % : 3 696 $. Le taux de 2,2 % ne vaut que pour une année qui commence après le 29 avril 2026.</p>"},{"id":"m6e5","titre":"Exercice 5 — Compte de l'actionnaire","enonce":"<p>Le compte de l'actionnaire est débiteur de 14 000 $ au 31 décembre 2026.</p>","questions":[{"id":"a","label":"Que faites-vous ?","type":"choice","options":[{"v":"a","t":"Le reclasser en dividende"},{"v":"b","t":"Le détailler et le signaler par écrit au CPA"},{"v":"c","t":"Rien : c'est courant"}],"answer":"b","pts":1,"comp":"Frontière CPA"}],"corrige":"<p>Un prêt à l'actionnaire peut être inclus dans son revenu, selon la date et la nature de chaque avance, les remboursements et plusieurs exceptions. Le solde au 31 décembre ne suffit pas pour conclure : la ressource détaille le compte et le signale ; le CPA décide.</p>"}]};
const M7E={"id":"m7e","titre":"M7 — Entraînement","mode":"train","exercices":[{"id":"m7e1","titre":"Exercice 1 — Tranches d'imposition","enonce":"<p>Revenu imposable de 70 000 $ en 2026. Ne tenez compte que du montant personnel de base.</p>","questions":[{"id":"a","label":"Impôt fédéral avant crédits ($)","type":"num","answer":10546.01,"pts":1,"comp":"Calcul de l'impôt","tol":0.005},{"id":"b","label":"Impôt fédéral après le crédit pour montant personnel de base ($)","type":"num","answer":8242.73,"pts":1,"comp":"Calcul de l'impôt","tol":0.005},{"id":"c","label":"Abattement du Québec ($)","type":"num","answer":1360.05,"pts":1,"comp":"Calcul de l'impôt","tol":0.005},{"id":"d","label":"Impôt du Québec après le crédit pour montant personnel de base ($)","type":"num","answer":7929.47,"pts":1,"comp":"Calcul de l'impôt","tol":0.005}],"corrige":"<p>(a) 58 523 × 14 % + 11 477 × 20,5 % = 10 546,01 $. (b) Moins 16 452 × 14 % = 2 303,28 $ : 8 242,73 $. (c) 8 242,73 × 16,5 % = 1 360,05 $. (d) 54 345 × 14 % + 15 655 × 19 % = 10 582,75 $, moins 18 952 × 14 % = 2 653,28 $ : 7 929,47 $.</p>"},{"id":"m7e2","titre":"Exercice 2 — Feuillets et relevés","enonce":"<p>Associez chaque revenu à son relevé du Québec.</p>","questions":[{"id":"a","label":"Salaire","type":"choice","options":[{"v":"1","t":"RL-1"},{"v":"3","t":"RL-3"},{"v":"6","t":"RL-6"},{"v":"31","t":"RL-31"}],"answer":"1","pts":1,"comp":"Feuillets"},{"id":"b","label":"Intérêts bancaires","type":"choice","options":[{"v":"1","t":"RL-1"},{"v":"3","t":"RL-3"},{"v":"6","t":"RL-6"},{"v":"31","t":"RL-31"}],"answer":"3","pts":1,"comp":"Feuillets"},{"id":"c","label":"Prestations de congé parental","type":"choice","options":[{"v":"1","t":"RL-1"},{"v":"3","t":"RL-3"},{"v":"6","t":"RL-6"},{"v":"31","t":"RL-31"}],"answer":"6","pts":1,"comp":"Feuillets"},{"id":"d","label":"Logement occupé au 31 décembre (crédit pour solidarité)","type":"choice","options":[{"v":"1","t":"RL-1"},{"v":"3","t":"RL-3"},{"v":"6","t":"RL-6"},{"v":"31","t":"RL-31"}],"answer":"31","pts":1,"comp":"Feuillets"}],"corrige":"<p>Salaire : T4 et RL-1. Intérêts : T5 et RL-3. RQAP : RL-6 (Québec seulement). Logement : RL-31, exigé pour le crédit pour solidarité.</p>"},{"id":"m7e3","titre":"Exercice 3 — Gain en capital","enonce":"<p>200 actions achetées 12 000 $ plus 25 $ de commission, vendues 18 500 $ moins 25 $ de frais.</p>","questions":[{"id":"a","label":"Gain en capital ($)","type":"num","answer":6450,"pts":1,"comp":"Gains en capital","tol":0.005},{"id":"b","label":"Gain en capital imposable ($)","type":"num","answer":3225,"pts":1,"comp":"Gains en capital","tol":0.005}],"corrige":"<p>18 475 − 12 025 = 6 450 $ ; au taux d'inclusion de 50 %, 3 225 $ imposables.</p>"},{"id":"m7e4","titre":"Exercice 4 — REER","enonce":"<p>Revenu gagné de 2025 : 60 000 $. Aucun droit inutilisé, aucun facteur d'équivalence.</p>","questions":[{"id":"a","label":"Maximum déductible pour 2026 ($)","type":"num","answer":10800,"pts":1,"comp":"REER","tol":0.005},{"id":"b","label":"Date limite de cotisation pour 2026","type":"choice","options":[{"v":"a","t":"Vendredi 30 avril 2027"},{"v":"b","t":"Mardi 15 juin 2027"},{"v":"c","t":"Lundi 1er mars 2027"},{"v":"d","t":"Mercredi 30 juin 2027"}],"answer":"c","pts":1,"comp":"Échéances"}],"corrige":"<p>60 000 × 18 % = 10 800 $, sous le plafond de 33 810 $. Date limite : 60e jour de 2027, le lundi 1er mars 2027.</p>"},{"id":"m7e5","titre":"Exercice 5 — Location","enonce":"<p>Loyers 14 400 $, dépenses courantes 11 900 $, DPA disponible 4 100 $.</p>","questions":[{"id":"a","label":"DPA permise ($)","type":"num","answer":2500,"pts":1,"comp":"Location","tol":0.005},{"id":"b","label":"Revenu net de location ($)","type":"num","answer":0,"pts":1,"comp":"Location","tol":0.005}],"corrige":"<p>Revenu avant DPA 2 500 $. La DPA ne peut pas créer de perte : elle est limitée à 2 500 $, et le revenu net est de 0 $.</p>"},{"id":"m7e6","titre":"Exercice 6 — Échéances","enonce":"<p>Une graphiste travailleuse autonome, année d'imposition 2026.</p>","questions":[{"id":"a","label":"Date limite de production","type":"choice","options":[{"v":"a","t":"Vendredi 30 avril 2027"},{"v":"b","t":"Mardi 15 juin 2027"},{"v":"c","t":"Lundi 1er mars 2027"},{"v":"d","t":"Mercredi 30 juin 2027"}],"answer":"b","pts":1,"comp":"Échéances"},{"id":"b","label":"Date limite de paiement du solde","type":"choice","options":[{"v":"a","t":"Vendredi 30 avril 2027"},{"v":"b","t":"Mardi 15 juin 2027"},{"v":"c","t":"Lundi 1er mars 2027"},{"v":"d","t":"Mercredi 30 juin 2027"}],"answer":"a","pts":1,"comp":"Échéances"}],"corrige":"<p>Production le mardi 15 juin 2027 ; paiement le vendredi 30 avril 2027.</p>"},{"id":"m7e7","titre":"Exercice 7 — T5008 et achats multiples","enonce":"<p>100 actions achetées à 20 $ en 2023 et 200 actions à 26 $ en 2024, avec 10 $ de commission à chaque achat. En 2026, vente de 150 actions à 31 $, moins 10 $ de frais. Le T5008 indique un coût de 3 312,50 $.</p>","questions":[{"id":"a","label":"PBR des 150 actions vendues ($)","type":"num","answer":3610,"pts":1,"comp":"Gains en capital","tol":0.005},{"id":"b","label":"Gain en capital ($)","type":"num","answer":1030,"pts":1,"comp":"Gains en capital","tol":0.005},{"id":"c","label":"Gain en capital imposable ($)","type":"num","answer":515,"pts":1,"comp":"Gains en capital","tol":0.005},{"id":"d","label":"Quel coût utilisez-vous ?","type":"choice","options":[{"v":"t","t":"Celui du T5008 (3 312,50 $)"},{"v":"m","t":"Le coût moyen reconstitué (3 610 $)"}],"answer":"m","pts":1,"comp":"Gains en capital"}],"corrige":"<p>Coût total 7 220 $ pour 300 actions ; PBR moyen des 150 vendues : 3 610 $. Produit net 4 640 $ ; gain 1 030 $ ; imposable 515 $. Le montant indiqué au T5008 ne correspond pas nécessairement au PBR fiscal : pour des biens identiques acquis à différents moments, il faut le reconstituer selon les règles applicables ; ici, le coût moyen est de 3 610 $.</p>"},{"id":"m7e8","titre":"Exercice 8 — Duplex habité et loué","enonce":"<p>Le client habite un logement de son duplex et loue l'autre, de même superficie. Taxes 4 800 $, assurance 1 600 $, intérêts hypothécaires 9 000 $, entretien des parties communes 1 200 $. Réparations dans le logement loué : 900 $. Loyers : 13 200 $.</p>","questions":[{"id":"a","label":"Dépenses déductibles ($)","type":"num","answer":9200,"pts":1,"comp":"Location","tol":0.005},{"id":"b","label":"Revenu de location avant DPA ($)","type":"num","answer":4000,"pts":1,"comp":"Location","tol":0.005},{"id":"c","label":"Le client veut réclamer la DPA","type":"choice","options":[{"v":"a","t":"La réclamer : elle réduit l'impôt"},{"v":"b","t":"Signaler au CPA : la DPA peut compromettre la désignation de résidence principale de la partie louée"}],"answer":"b","pts":1,"comp":"Frontière CPA"}],"corrige":"<p>Dépenses communes 16 600 $ × 50 % = 8 300 $, plus 900 $ : 9 200 $. Revenu avant DPA : 4 000 $. Réclamer la DPA sur la partie louée peut empêcher de la désigner comme résidence principale à la vente : décision du CPA.</p>"},{"id":"m7e9","titre":"Exercice 9 — Frais de garde","enonce":"<p>Amina (revenu gagné 40 000 $, revenu net 38 000 $) et Yanis (revenu net 72 000 $). Enfants : Léa, 4 ans, et Adam, 15 ans. Frais de garde 2026 : 9 000 $ pour Léa, 3 000 $ pour Adam.</p>","questions":[{"id":"a","label":"Qui demande la déduction fédérale ?","type":"choice","options":[{"v":"a","t":"Amina"},{"v":"y","t":"Yanis"},{"v":"p","t":"Les deux, moitié-moitié"}],"answer":"a","pts":1,"comp":"Frais de garde"},{"id":"b","label":"Déduction fédérale ($)","type":"num","answer":12000,"pts":1,"comp":"Frais de garde","tol":0.005},{"id":"c","label":"Frais retenus pour le crédit du Québec, avant ses plafonds ($)","type":"num","answer":9000,"pts":1,"comp":"Frais de garde","tol":0.005}],"corrige":"<p>Amina, revenu net le moins élevé. Déduction = le moins élevé de 12 000 $, 13 000 $ (8 000 $ + 5 000 $) et 26 666,67 $ : 12 000 $. Au Québec, depuis 2026, l'enfant doit avoir moins de 14 ans : les frais d'Adam sont exclus, il reste 9 000 $.</p>"},{"id":"m7e10","titre":"Exercice 10 — Dossier à drapeaux rouges","enonce":"<p>Pour chaque élément, choisissez ce que vous faites.</p>","questions":[{"id":"a","label":"T4/RL-1 du même employeur que l'an dernier","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"t","pts":1,"comp":"Frontière CPA"},{"id":"b","label":"Le T5 d'une banque, présent l'an dernier, est absent","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"p","pts":1,"comp":"Frontière CPA"},{"id":"c","label":"Le client dit avoir quitté le Canada en juillet 2026","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"c","pts":1,"comp":"Frontière CPA"},{"id":"d","label":"Compte de placement à l'étranger de 150 000 $","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"c","pts":1,"comp":"Frontière CPA"},{"id":"e","label":"Trois reçus de dons d'organismes enregistrés","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"t","pts":1,"comp":"Frontière CPA"},{"id":"f","label":"Client locataire sans RL-31","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"p","pts":1,"comp":"Frontière CPA"},{"id":"g","label":"Vente d'un chalet utilisé par la famille","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"c","pts":1,"comp":"Frontière CPA"},{"id":"h","label":"« Vaut-il mieux cotiser au REER ou au CELI ? »","type":"choice","options":[{"v":"t","t":"Je traite"},{"v":"p","t":"Je demande une pièce"},{"v":"c","t":"Je signale au CPA"}],"answer":"c","pts":1,"comp":"Frontière CPA"}],"corrige":"<p>(a) je traite ; (b) pièce ; (c) CPA, statut de résidence ; (d) CPA, biens étrangers ; (e) je traite ; (f) pièce ; (g) CPA, gain et désignation ; (h) CPA, c'est un conseil.</p>"}]};

const LECONS={"m4": [{"t": "1. Ce qui change par rapport à la Tunisie", "h": "<p>Au Québec, il y a <strong>deux taxes</strong> sur la même vente : la TPS (fédérale, 5 %) et la TVQ (québécoise, 9,975 %). Elles obéissent à deux lois distinctes, mais une entreprise québécoise s'inscrit aux deux par une seule démarche auprès de Revenu Québec, qui administre les deux taxes. La logique reste celle d'une TVA : taxe collectée moins taxe payée sur les achats. Le vocabulaire change :</p>\n<table><thead><tr><th>Québec</th><th>Tunisie / France</th></tr></thead><tbody><tr><td>Fourniture taxable</td><td>Opération imposable</td></tr><tr><td>Fourniture détaxée (taux zéro)</td><td>Opération imposable au taux 0 %, droit à déduction</td></tr><tr><td>Fourniture exonérée</td><td>Opération exonérée, sans droit à déduction</td></tr><tr><td>CTI (TPS) / RTI (TVQ)</td><td>TVA déductible</td></tr><tr><td>Inscrit</td><td>Assujetti immatriculé</td></tr><tr><td>Taxe nette</td><td>TVA à payer ou crédit de TVA</td></tr></tbody></table>\n<p><strong>Réflexe tunisien → Pratique québécoise :</strong> on calcule une seule TVA sur le hors-taxe. Ici, la TPS et la TVQ se calculent <strong>chacune sur le prix hors taxes</strong> et se déclarent sur deux lignes distinctes. Ne jamais saisir une « taxe globale de 14,975 % » sur un seul compte.</p>"}, {"t": "2. Paramètres 2026", "h": "<table><thead><tr><th>Paramètre</th><th>Valeur 2026</th><th>Source</th></tr></thead><tbody><tr><td>TPS</td><td>5 %</td><td>ARC</td></tr><tr><td>TVQ</td><td>9,975 %</td><td>ARC, Revenu Québec</td></tr><tr><td>TVH Ontario</td><td>13 %</td><td>ARC</td></tr><tr><td>TVH Nouveau-Brunswick, Terre-Neuve-et-Labrador, Î.-P.-É.</td><td>15 %</td><td>ARC</td></tr><tr><td>TVH Nouvelle-Écosse (depuis le 1er avril 2025)</td><td>14 %</td><td>ARC</td></tr><tr><td>Seuil du petit fournisseur</td><td>30 000 $ (un trimestre civil ou les 4 derniers)</td><td>Revenu Québec</td></tr><tr><td>Déclaration annuelle possible</td><td>Fournitures taxables ≤ 1 500 000 $</td><td>ARC</td></tr><tr><td>Déclaration trimestrielle ou mensuelle</td><td>Plus de 1 500 000 $ et moins de 6 000 000 $</td><td>ARC</td></tr><tr><td>Déclaration mensuelle obligatoire</td><td>Plus de 6 000 000 $</td><td>ARC</td></tr><tr><td>Méthode rapide — services</td><td>TPS 3,6 % ; TVQ 6,6 %</td><td>Revenu Québec</td></tr><tr><td>Méthode rapide — revente de biens</td><td>TPS 1,8 % ; TVQ 3,4 %</td><td>Revenu Québec</td></tr><tr><td>Méthode rapide — crédit de 1 %</td><td>Sur les premiers 30 000 $ (TPS incluse) et 31 421 $ (TVQ incluse) par exercice</td><td>Revenu Québec</td></tr></tbody></table>"}, {"t": "3. Taxable, détaxé ou exonéré", "h": "<p>C'est la première question à se poser pour chaque vente et chaque achat.</p>\n<ul><li><p><strong>Taxable</strong> : TPS et TVQ facturées. L'entreprise peut récupérer les taxes sur ses achats admissibles, sous réserve des règles de la section 6. Exemples : services comptables, location d'un local commercial, réparation, restaurant.</p></li><li><p><strong>Détaxé (taux zéro)</strong> : 0 % facturé ; taxes sur les achats admissibles récupérables. Exemples : produits alimentaires de base, médicaments sur ordonnance, exportations.</p></li><li><p><strong>Exonéré</strong> : rien facturé ; taxes sur les achats liés <strong>non</strong> récupérables. Exemples : loyer résidentiel de longue durée, services financiers (intérêts, frais bancaires).</p></li><li><p><strong>Hors champ</strong> : l'opération n'est pas une fourniture au sens des taxes. Exemples : salaires, dividendes, amendes. Rien à déclarer, rien à récupérer.</p></li><li><p><strong>Taxe particulière</strong> : une autre taxe québécoise remplace la TPS/TVQ. Exemple : la taxe sur les primes d'assurance (voir le piège ci-dessous).</p></li></ul>\n<p><strong>Piège :</strong> les primes d'assurance n'ont ni TPS ni TVQ, mais la taxe québécoise sur les primes d'assurance apparaît sur la facture. Son taux est de <strong>9 %</strong> pour les primes payées jusqu'au 31 décembre 2026, puis de <strong>9,975 %</strong> pour les primes payées après cette date. Elle ne donne jamais droit à un RTI : elle va en charge avec la prime.</p>"}, {"t": "4. Inscription", "h": "<p>Une entreprise doit s'inscrire quand ses fournitures taxables (détaxées comprises, faites dans le monde, avec celles de ses associés) dépassent 30 000 $ au cours d'un trimestre civil ou des quatre trimestres civils qui le précèdent. Le calcul exclut les taxes, les services financiers et les ventes d'immobilisations. Sous ce seuil, l'entreprise est un « petit fournisseur » : l'inscription est facultative.</p>\n<p><strong>Rôle de la ressource :</strong> surveiller le cumul des ventes sur quatre trimestres à chaque fermeture de mois, et signaler au CPA quand le client approche 30 000 $. <strong>Rôle du CPA :</strong> conseiller le client sur l'inscription (obligatoire ou volontaire).</p>"}, {"t": "5. Pièces justificatives exigées pour un CTI/RTI", "h": "<p>Sans les bons renseignements sur la facture d'achat, Revenu Québec refuse le crédit en vérification, même si la dépense est réelle.</p>\n<table><thead><tr><th>Renseignement</th><th>Moins de 100 $</th><th>100 $ à 499,99 $</th><th>500 $ et plus</th></tr></thead><tbody><tr><td>Nom du fournisseur</td><td>Oui</td><td>Oui</td><td>Oui</td></tr><tr><td>Date de la facture</td><td>Oui</td><td>Oui</td><td>Oui</td></tr><tr><td>Montant total</td><td>Oui</td><td>Oui</td><td>Oui</td></tr><tr><td>Montant de taxe</td><td>TVQ seulement</td><td>Oui</td><td>Oui</td></tr><tr><td>Numéros d'inscription TPS et TVQ du fournisseur</td><td>Non</td><td>Oui</td><td>Oui</td></tr><tr><td>Nom de l'acheteur</td><td>Non</td><td>Non</td><td>Oui</td></tr><tr><td>Modalités de paiement</td><td>Non</td><td>Non</td><td>Oui</td></tr><tr><td>Description du bien ou du service</td><td>TVQ seulement</td><td>TVQ seulement</td><td>Oui</td></tr></tbody></table>\n<p>Les seuils portent sur la valeur totale, taxes comprises. À partir de 500 $, les renseignements exigés comprennent notamment le nom de l'acheteur : la facture doit donc désigner <strong>l'entité qui réclame</strong> (la société, pas son dirigeant). Des règles particulières existent pour les restaurants et les taxis (document complémentaire à la facture du système d'enregistrement des ventes).</p>"}, {"t": "6. Règles de récupération (CTI/RTI)", "h": "<ul><li><p><strong>Dépenses de repas et de divertissement</strong> : en règle générale, récupération limitée à 50 % de la taxe payée. Des exceptions existent : tout cas inhabituel (fête pour tout le personnel, repas refacturé à un client) est signalé au CPA.</p></li><li><p><strong>Dépenses personnelles</strong> et abonnements à des clubs de loisirs, de golf ou de sport : aucune récupération.</p></li><li><p><strong>Utilisation mixte</strong> (activité taxable et exonérée) : répartir selon une méthode juste et raisonnable, par exemple la superficie, le temps ou les revenus. Le choix de la méthode revient au CPA ; la ressource l'applique de façon constante.</p></li><li><p><strong>Dépenses remboursées à un employé</strong> (taxes incluses) : méthode factorielle, CTI = 4/104 et RTI = 9/109 du montant remboursé.</p></li><li><p><strong>Délai</strong> : un CTI/RTI oublié peut généralement être réclamé jusqu'à la date limite de la déclaration de la période qui se termine quatre ans après la période d'achat.</p></li><li><p><strong>Grandes entreprises</strong> : les anciennes restrictions sur les RTI (télécommunications, énergie, véhicules) sont complètement éliminées depuis le 1er janvier 2021. Seule la limite générale de 50 % sur les repas reste.</p></li></ul>\n<p><strong>Frontière ressource / CPA :</strong> la ressource applique ces règles et marque dans la déclaration chaque élément incertain (usage mixte, véhicule, dépense qui semble personnelle). Le CPA décide du traitement.</p>"}, {"t": "7. Clients hors Québec (TVH)", "h": "<p>Le taux à facturer dépend du <strong>lieu de la fourniture</strong> déterminé par les règles fiscales, pas du siège du vendeur. Cas simple : un bien meuble vendu par un inscrit québécois et livré au client en Ontario est généralement fourni en Ontario ; il porte alors la TVH de 13 %, sans TVQ. La TVH se déclare sur la déclaration TPS/TVH ; elle n'apparaît pas sur la déclaration de TVQ. Pour les services, les biens incorporels et les livraisons inhabituelles (client qui vient chercher le bien, transporteur mandaté par le client), la ressource signale le cas au CPA.</p>"}, {"t": "8. Méthode rapide", "h": "<p>C'est un choix fait par le client, sur conseil du CPA. L'entreprise facture la TPS et la TVQ normalement, mais remet un pourcentage fixe de ses ventes <strong>taxes comprises</strong>, sans réclamer de CTI/RTI sur ses dépenses courantes. Elle peut toujours réclamer les taxes sur les achats d'immobilisations. Pour l'utiliser, les ventes taxables annuelles mondiales ne doivent pas dépasser 400 000 $ (TPS comprise) et 418 952 $ (TVQ comprise). Le crédit de 1 % s'inscrit à la ligne 107 (TPS) et à la ligne 207 (TVQ).</p>\n<p><strong>Exclusions à connaître :</strong> ne peuvent pas utiliser la méthode rapide les entreprises qui rendent des services juridiques, comptables ou actuariels, de consultation financière ou fiscale, de tenue de livres ou de préparation de déclarations de revenus, ainsi que les institutions financières désignées, les organismes de bienfaisance, les OBNL admissibles et certains organismes de services publics. Un cabinet comptable client n'y a donc jamais droit.</p>\n<p><strong>Piège :</strong> appliquer la méthode rapide sur le hors-taxe. Le taux s'applique au montant <strong>qui inclut la taxe</strong> visée.</p>"}, {"t": "9. Périodes et échéances", "h": "<table><thead><tr><th>Fréquence</th><th>Date limite de production et de paiement</th></tr></thead><tbody><tr><td>Mensuelle ou trimestrielle</td><td>Un mois après la fin de la période</td></tr><tr><td>Annuelle (cas général)</td><td>Trois mois après la fin de l'exercice ; acomptes trimestriels le dernier jour du mois suivant chaque trimestre, s'il y a lieu</td></tr><tr><td>Annuelle, particulier en affaires, exercice au 31 décembre</td><td>Production le 15 juin ; paiement le 30 avril</td></tr></tbody></table>\n<p>Un inscrit doit produire sa déclaration pour <strong>chaque période de déclaration</strong>, même si aucune taxe nette n'est à remettre. Quand la date tombe un samedi, un dimanche ou un jour férié, elle passe au jour ouvrable suivant : l'échéance du trimestre juillet–septembre 2026 (samedi 31 octobre) devient le lundi 2 novembre 2026.</p>\n<p><strong>Réflexe à prendre :</strong> la taxe se déclare pour la période où elle est perçue <strong>ou devient due</strong> (en général à la date de la facture), pas quand le client paie. Une facture de septembre encaissée en octobre appartient à la déclaration du trimestre de septembre. Il en va de même pour les CTI/RTI : la facture d'achat compte, pas la date du paiement au fournisseur.</p>"}, {"t": "10. Conciliation avant remise au CPA", "h": "<p>Avant de remettre une déclaration au CPA, la ressource joint une conciliation d'une page :</p>\n<ol><li><p>Ventes taxables du grand livre × taux = taxe attendue. Écart de plus de 1 % avec la taxe perçue au grand livre → expliquer (ventes détaxées, crédits, notes de crédit).</p></li><li><p>Soldes des comptes « TPS à payer », « TVQ à payer », « CTI » et « RTI » = montants des lignes de la déclaration.</p></li><li><p>Solde des comptes de taxes après le paiement de la période précédente = zéro, sinon expliquer.</p></li><li><p>Liste des éléments marqués pour décision du CPA.</p></li></ol>"}, {"t": "Sources M4 (consultées le 27 septembre 2026)", "h": "<ul><li><p><a href=\"https://www.canada.ca/fr/agence-revenu/services/impot/entreprises/sujets/tps-tvh-entreprises/facturer-percevoir-quel-taux/calculatrice.html\" target=\"_blank\" rel=\"noopener\">ARC — Calculatrice et tableau des taux de TPS/TVH</a></p></li><li><p><a href=\"https://www.canada.ca/fr/agence-revenu/services/services-electroniques/services-numeriques-entreprises/dossier-entreprise/produire-choix.html\" target=\"_blank\" rel=\"noopener\">ARC — Choix de la période de déclaration (seuils)</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/inscription-aux-fichiers-de-la-tps-et-de-la-tvq/petit-fournisseur/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Petit fournisseur</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/declaration-de-la-tps-et-de-la-tvq/periodes-de-declaration/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Périodes de déclaration</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/perception-de-la-tps-et-de-la-tvq/preparation-des-factures/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Préparation des factures</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/credit-de-taxe-sur-les-intrants-et-remboursement-de-la-taxe-sur-les-intrants/comment-demander-des-cti-et-des-rti/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Comment demander des CTI et des RTI</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/credit-de-taxe-sur-les-intrants-et-remboursement-de-la-taxe-sur-les-intrants/comment-demander-des-cti-et-des-rti/depenses-dexploitation/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Dépenses d'exploitation (usage mixte)</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/situations-particulieres-liees-a-la-tpstvh-et-a-la-tvq/depenses-engagees-par-les-salaries-les-associes-et-les-benevoles/remboursements/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Remboursements aux salariés (méthode factorielle)</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/declaration-de-la-tps-et-de-la-tvq/methode-rapide-de-calcul-des-montants-de-la-tps-et-de-la-tvq-a-remettre/taux-applicables/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Méthode rapide, taux applicables</a></p></li><li><p><a href=\"https://www.budget.finances.gouv.qc.ca/budget/outils/depenses-fiscales/fiches/fiche-310601.asp\" target=\"_blank\" rel=\"noopener\">Ministère des Finances du Québec — Frais de représentation (limite de 50 %, fin des restrictions)</a></p></li></ul>\n<ul><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/declaration-de-la-tps-et-de-la-tvq/methode-rapide-de-calcul-des-montants-de-la-tps-et-de-la-tvq-a-remettre/qui-peut-utiliser-la-methode-rapide/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Qui peut utiliser la méthode rapide ?</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/citoyens/taxes/biens-et-services-taxables-detaxes-ou-exoneres/taxe-sur-les-primes-dassurance/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Taxe sur les primes d'assurance (9 %)</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/salle-de-presse/nouvelles-fiscales/details/2026-04-09/uniformisation-du-taux-de-la-taxe-sur-les-primes-dassurance-avec-celui-de-la-tvq/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Uniformisation du taux de la taxe sur les primes d'assurance avec la TVQ (9 avril 2026)</a></p></li></ul>"}], "m5": [{"t": "1. Ce qui change par rapport à la Tunisie", "h": "<p>Chaque paie québécoise alimente <strong>deux administrations</strong>. Revenu Québec reçoit l'impôt du Québec, le RRQ, le RQAP, le FSS et les versements périodiques de la prime CNESST (qu'il transfère à la CNESST ; la CNESST reste responsable de la prime et de la déclaration annuelle des salaires). L'ARC reçoit l'impôt fédéral et l'assurance-emploi (AE). Il y a donc deux remises, deux numéros d'employeur et, en fin d'année, deux feuillets par employé : le T4 (ARC) et le RL-1 (Revenu Québec).</p>\n<p><strong>Réflexe tunisien → Pratique québécoise :</strong> une seule caisse sociale et une déclaration globale. Ici, chaque cotisation a <strong>son propre plafond annuel</strong> et s'arrête à une date différente dans l'année pour un même salarié. On suit les cumuls employé par employé, jamais un pourcentage global.</p>"}, {"t": "2. Paramètres 2026", "h": "<table><thead><tr><th>Cotisation</th><th>Employé</th><th>Employeur</th><th>Plafond 2026</th><th>Remise à</th></tr></thead><tbody><tr><td>RRQ de base + 1re supplémentaire</td><td>6,30 %</td><td>6,30 %</td><td>Gains entre 3 500 $ et 74 600 $ ; maximum 4 479,30 $ chacun</td><td>Revenu Québec</td></tr><tr><td>RRQ 2e supplémentaire</td><td>4 %</td><td>4 %</td><td>Gains entre 74 600 $ et 85 000 $ ; maximum 416 $ chacun</td><td>Revenu Québec</td></tr><tr><td>RQAP</td><td>0,430 %</td><td>0,602 %</td><td>103 000 $ ; maximum 442,90 $ (employé) et 620,06 $ (employeur)</td><td>Revenu Québec</td></tr><tr><td>AE (taux Québec)</td><td>1,30 %</td><td>1,82 % (1,4 × le taux de l'employé)</td><td>68 900 $ ; maximum 895,70 $ (employé) et 1 253,98 $ (employeur)</td><td>ARC</td></tr><tr><td>FSS</td><td>—</td><td>1,65 % si masse salariale ≤ 1 M$ (hors secteurs primaire et manufacturier) ; formule jusqu'à 7,8 M$ ; 4,26 % au-delà</td><td>Aucun</td><td>Revenu Québec</td></tr><tr><td>CNESST (santé-sécurité)</td><td>—</td><td>Taux de l'unité de classification du client, inscrit sur sa décision de la CNESST (le taux moyen 2026 de 1,54 $ par 100 $ ne sert jamais pour un client)</td><td>Salaire assurable 103 000 $</td><td>Revenu Québec, avec les retenues</td></tr><tr><td>Normes du travail (CNT)</td><td>—</td><td>0,06 %</td><td>103 000 $</td><td>Une fois par an, avec le Sommaire 1</td></tr><tr><td>Formation de la main-d'œuvre</td><td>—</td><td>1 % de la masse salariale en dépenses de formation admissibles, sinon cotisation</td><td>S'applique si masse salariale &gt; 2 M$</td><td>Sommaire 1</td></tr></tbody></table>\n<p>Impôt 2026 : Québec 14 % jusqu'à 54 345 $ (puis 19 %, 24 %, 25,75 %), montant personnel de base 18 952 $. Fédéral 14 % jusqu'à 58 523 $ (puis 20,5 %, 26 %, 29 %, 33 %), montant personnel de base 16 452 $, réduit par l'abattement du Québec de 16,5 %. L'exemption RRQ par paie est de 134,62 $ pour 26 paies (3 500 ÷ 26). Salaire minimum depuis le 1er mai 2026 : 16,60 $ l'heure.</p>"}, {"t": "3. Calculer une paie, dans l'ordre", "h": "<ol><li><p>Salaire brut + avantages imposables (qui peuvent différer entre Québec et fédéral).</p></li><li><p>RRQ : (brut − exemption de la période) × 6,30 %, jusqu'au plafond ; puis 2e supplémentaire au-delà de 74 600 $ cumulés.</p></li><li><p>RQAP : brut × 0,430 %, sans maximum par période, jusqu'au plafond annuel.</p></li><li><p>AE : brut assurable × 1,30 %, jusqu'au plafond annuel.</p></li><li><p>Impôts : jamais à la main. Le logiciel du client, l'outil de calcul de Revenu Québec (WebRAS) et la calculatrice en ligne de l'ARC (CDRP), selon les formulaires TP-1015.3 et TD1 de l'employé.</p></li><li><p>Autres retenues (assurance collective, syndicat, avance) ; salaire net.</p></li><li><p>Cotisations de l'employeur : RRQ, RQAP, AE, FSS, CNESST.</p></li></ol>\n<p><strong>Piège :</strong> oublier qu'une prime ou une paie de vacances fait monter les cumuls. Un salarié qui atteint le plafond AE en octobre n'a plus de retenue AE jusqu'au 31 décembre, et elle reprend en janvier.</p>"}, {"t": "4. Remises", "h": "<p>Revenu Québec attribue à chaque employeur une fréquence de paiement, selon son paiement mensuel moyen des années de référence ; un nouvel employeur a des règles propres. La fréquence et le calendrier se lisent <strong>dans le compte employeur du client</strong>, jamais de mémoire. Repères 2026 :</p>\n<table><thead><tr><th>Fréquence</th><th>Condition (2026)</th><th>Date limite de paiement</th></tr></thead><tbody><tr><td>Annuelle</td><td>Total des retenues et cotisations 2025 ≤ 2 400 $</td><td>15 janvier de l'année suivante</td></tr><tr><td>Trimestrielle</td><td>Paiement mensuel moyen ≤ 3 000 $ et dossier en règle</td><td>15 avril, 15 juillet, 15 octobre, 15 janvier</td></tr><tr><td>Mensuelle</td><td>Paiement mensuel moyen &lt; 25 000 $</td><td>Le 15 du mois suivant la paie</td></tr><tr><td>Bimensuelle</td><td>De 25 000 $ à 100 000 $</td><td>Paies du 1er au 15 : le 25 du même mois ; paies du 16 à la fin du mois : le 10 du mois suivant</td></tr><tr><td>Hebdomadaire</td><td>100 000 $ ou plus</td><td>Le 3e jour ouvrable après la fin de chaque période de 7 jours</td></tr></tbody></table>\n<p>Une date limite un samedi, un dimanche ou un jour férié passe au jour ouvrable suivant. La remise fédérale (impôt fédéral et AE) suit la fréquence que l'ARC attribue au client, qui peut être différente.</p>\n<p><strong>Frontière ressource / CPA :</strong> la ressource prépare les deux bordereaux et les chiffres ; le client ou le CPA autorise le paiement. Une remise en retard coûte des pénalités au client : la ressource alerte <strong>par écrit, trois jours ouvrables avant</strong> l'échéance, s'il manque une donnée.</p>"}, {"t": "5. Normes du travail à connaître", "h": "<ul><li><p><strong>Vacances</strong> : indemnité de 4 % du salaire brut de l'année de référence si le salarié a moins de 3 ans de service continu à la fin de l'année de référence, 6 % à partir de 3 ans. L'année de référence va habituellement du 1er mai au 30 avril, sauf si l'employeur, une convention collective ou un décret fixe une autre période. Le salaire brut inclut primes, commissions, heures supplémentaires et indemnités de congé.</p></li><li><p><strong>Jours fériés</strong> : indemnité égale à 1/20 du salaire gagné pendant les 4 semaines complètes de paie avant la semaine du congé, sans les heures supplémentaires.</p></li></ul>"}, {"t": "6. Fin d'année : T4, RL-1 et Sommaire 1", "h": "<ul><li><p>Date limite : dernier jour de février de l'année suivante, pour la transmission aux gouvernements et la remise aux employés. Pour l'année 2026, le 28 février 2027 est un dimanche : la date limite devient le <strong>lundi 1er mars 2027</strong>.</p></li><li><p>Plus de 5 relevés ou feuillets d'un même type : transmission électronique obligatoire, selon les règles et les services de chaque administration (services en ligne ou logiciel autorisé pour Revenu Québec ; Internet pour l'ARC).</p></li><li><p>Le Sommaire 1 calcule aussi la cotisation annuelle aux normes du travail et, s'il y a lieu, la participation de 1 % à la formation ; il se paie dans le même délai.</p></li><li><p><strong>Différences T4 / RL-1 :</strong> les montants ne sont pas toujours identiques. Exemple classique : la cotisation de l'employeur à un régime privé d'assurance maladie est un avantage imposable au Québec (incluse à la case A et déclarée à la case J du RL-1), mais pas au fédéral (absente de la case 14 du T4).</p></li></ul>\n<p><strong>Conciliation obligatoire avant remise au CPA :</strong> total des cases du RL-1 et du T4 = registre de paie annuel ; retenues déclarées = remises payées dans l'année ; tout écart expliqué ligne par ligne.</p>"}, {"t": "Sources M5 (consultées le 27 septembre 2026)", "h": "<ul><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/retenues-a-la-source-et-cotisations-de-lemployeur/employeur-principaux-changements-2026/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Employeur, principaux changements 2026</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/retenues-a-la-source-et-cotisations-de-lemployeur/calcul-des-retenues-et-des-cotisations/cotisation-relative-aux-normes-du-travail/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Cotisation relative aux normes du travail</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/retenues-a-la-source-et-cotisations-de-lemployeur/verser-les-retenues-a-la-source-et-vos-cotisations-demployeur/frequence-de-paiement/paiement-mensuel-moyen/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Paiement mensuel moyen</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/services-en-ligne/formulaires-et-publications/rl-1-g/guide-du-releve-1-revenus-demploi-et-revenus-divers/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Guide du relevé 1</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/releves-et-sommaires/transmission-de-releves-et-de-sommaires/transmission-de-releves-et-de-sommaires-a-revenu-quebec/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Transmission des relevés</a></p></li><li><p><a href=\"https://www.canada.ca/fr/emploi-developpement-social/nouvelles/2025/09/la-commission-de-lassurance-emploi-du-canada-determine-le-taux-de-cotisation-a-lassurance-emploi-pour-2026.html\" target=\"_blank\" rel=\"noopener\">EDSC — Taux de cotisation à l'AE pour 2026</a></p></li><li><p><a href=\"https://www.canada.ca/content/dam/cra-arc/migration/cra-arc/tx/bsnss/tpcs/pyrll/t4032/2026/t4032-qc-1-26f.pdf\" target=\"_blank\" rel=\"noopener\">ARC — T4032-QC, tables de retenues 2026 (taux fédéral de 14 %, abattement de 16,5 %)</a></p></li><li><p><a href=\"https://www.canada.ca/fr/agence-revenu/services/impot/entreprises/sujets/remplir-feuillets-sommaires/declaration-renseignements-t4rsp-t4rif/quand-comment-produire/methodes-production-electronique.html\" target=\"_blank\" rel=\"noopener\">ARC — Production électronique au-delà de 5 feuillets</a></p></li><li><p><a href=\"https://www.cnesst.gouv.qc.ca/fr/demarches-formulaires/employeurs/assurance-sante-securite-travail/tarification/taux-prime\" target=\"_blank\" rel=\"noopener\">CNESST — Taux moyen de prime 2026</a></p></li><li><p><a href=\"https://www.cnesst.gouv.qc.ca/fr/conditions-travail/salaire-paye/salaire/salaire-minimum\" target=\"_blank\" rel=\"noopener\">CNESST — Salaire minimum</a></p></li><li><p><a href=\"https://www.cnesst.gouv.qc.ca/fr/conditions-travail/conges/vacances-annuelles\" target=\"_blank\" rel=\"noopener\">CNESST — Vacances annuelles</a></p></li><li><p><a href=\"https://www.cnesst.gouv.qc.ca/fr/conditions-travail/conges/jours-feries/calculer-indemnites-pour-un-jour-ferie\" target=\"_blank\" rel=\"noopener\">CNESST — Indemnité pour un jour férié</a></p></li><li><p>Taux fédéraux 2026 par tranche : <a href=\"https://harvestportfolios.com/fr-CA/cra-announces-federal-tax-bracket-thresholds-for-2026/\" target=\"_blank\" rel=\"noopener\">résumé Harvest ETFs</a>, à recouper avec la T4032-QC chaque janvier.</p></li></ul>\n<ul><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/retenues-a-la-source-et-cotisations-de-lemployeur/verser-les-retenues-a-la-source-et-vos-cotisations-demployeur/frequence-de-paiement/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Fréquences et délais de paiement des retenues et des cotisations</a></p></li></ul>"}], "lex": [{"t": "Lexique minimal", "h": "<table><thead><tr><th>Terme québécois</th><th>Sens</th></tr></thead><tbody><tr><td>Fourniture</td><td>Toute vente, location ou prestation (« opération » en Tunisie)</td></tr><tr><td>Fourniture détaxée</td><td>Taxée à 0 %, taxes sur les achats récupérables</td></tr><tr><td>Fourniture exonérée</td><td>Sans taxe, taxes sur les achats non récupérables</td></tr><tr><td>Hors champ</td><td>Hors du régime TPS/TVQ (salaires, dividendes, amendes)</td></tr><tr><td>CTI / RTI</td><td>TPS / TVQ payée sur les achats et récupérée (TVA déductible)</td></tr><tr><td>Petit fournisseur</td><td>Entreprise sous 30 000 $ de ventes taxables, non obligée de s'inscrire</td></tr><tr><td>Production / remise</td><td>Production = déposer la déclaration ; remise = verser l'argent. Ce sont deux gestes distincts</td></tr><tr><td>Retenue à la source (DAS)</td><td>Montant retenu sur la paie et remis aux gouvernements</td></tr><tr><td>MGA</td><td>Maximum des gains admissibles au RRQ (74 600 $ en 2026)</td></tr><tr><td>Rémunération assurable</td><td>Salaire soumis à l'AE ou au RQAP, jusqu'à un plafond</td></tr><tr><td>FSS</td><td>Fonds des services de santé : cotisation de l'employeur seulement</td></tr><tr><td>FDRCMO</td><td>Fonds de formation de la main-d'œuvre (« loi du 1 % »)</td></tr><tr><td>Sommaire 1</td><td>Récapitulatif annuel des RL-1 et des cotisations de l'employeur au Québec</td></tr><tr><td>Avantage imposable</td><td>Avantage en nature ajouté au salaire imposable (voiture, assurance, téléphone)</td></tr><tr><td>Année de référence</td><td>Période de calcul des vacances, habituellement du 1er mai au 30 avril</td></tr><tr><td>Avis de cotisation</td><td>Décision de l'administration après traitement d'une déclaration</td></tr></tbody></table>"}], "intro": "<p><strong>Règle d'or du programme :</strong> la ressource prépare, documente et signale ; le CPA du cabinet client décide, signe et conseille. Chaque module rappelle où passe cette frontière.</p><p>Deux gestes à ne pas confondre : <strong>appliquer une règle claire</strong> (5 % de TPS sur une facture de services) relève de la ressource ; <strong>qualifier une situation</strong> (dépense personnelle ou d'affaires, lieu de fourniture d'un service, choix de la méthode rapide, salaire ou dividendes) relève du CPA. Devant une qualification, la ressource s'arrête, documente les faits et pose une question précise.</p><p><strong>Comment lire les encadrés :</strong></p>\n<ul><li><p><strong>Réflexe tunisien → Pratique québécoise</strong> : une habitude qui cause des erreurs, et la bonne pratique.</p></li><li><p><strong>Frontière ressource / CPA</strong> : ce que la ressource fait seule, et ce qu'elle doit faire valider.</p></li><li><p><strong>Piège</strong> : une erreur fréquente qu'un CPA repère immédiatement.</p></li></ul>\n", "m7": [{"t": "1. Ce qui change par rapport à la Tunisie", "h": "<p>Chaque résident du Québec au 31 décembre produit <strong>deux déclarations</strong> pour l'année civile : la T1 à l'ARC et la TP-1 à Revenu Québec. C'est une autodéclaration : même un salarié dont l'impôt a été retenu à la source produit ses déclarations, et c'est souvent ainsi qu'il obtient ses remboursements et ses prestations. Les conjoints produisent chacun leurs déclarations ; certains crédits se transfèrent ou se partagent, et le revenu familial sert au calcul des prestations.</p>\n<p><strong>Réflexe tunisien → Pratique québécoise :</strong> considérer que la retenue sur salaire règle l'impôt du salarié. Ici, la retenue n'est qu'un acompte : la déclaration calcule l'impôt réel, et un oubli de feuillet crée presque toujours un avis de cotisation avec intérêts.</p>"}, {"t": "2. Paramètres 2026", "h": "<table><thead><tr><th>Paramètre</th><th>Valeur 2026</th><th>Source</th></tr></thead><tbody><tr><td>Impôt fédéral</td><td>14 % jusqu'à 58 523 $ ; 20,5 % jusqu'à 117 045 $ ; 26 % jusqu'à 181 440 $ ; 29 % jusqu'à 258 482 $ ; 33 % au-delà</td><td>ARC</td></tr><tr><td>Montant personnel de base fédéral</td><td>16 452 $ (réduit jusqu'à 14 829 $ entre 181 440 $ et 258 482 $ de revenu net)</td><td>ARC, T4127</td></tr><tr><td>Abattement du Québec</td><td>16,5 % de l'impôt fédéral de base</td><td>ARC, T4032-QC</td></tr><tr><td>Impôt du Québec</td><td>14 % jusqu'à 54 345 $ ; 19 % jusqu'à 108 680 $ ; 24 % jusqu'à 132 245 $ ; 25,75 % au-delà</td><td>Revenu Québec</td></tr><tr><td>Montant personnel de base du Québec</td><td>18 952 $</td><td>Revenu Québec</td></tr><tr><td>Déduction pour travailleur (Québec)</td><td>Maximum 1 450 $</td><td>Revenu Québec</td></tr><tr><td>Plafond REER</td><td>18 % du revenu gagné de 2025, maximum 33 810 $</td><td>ARC</td></tr><tr><td>Plafond CELI</td><td>7 000 $</td><td>ARC</td></tr><tr><td>Taux d'inclusion des gains en capital</td><td>50 % (la hausse annoncée a été annulée le 21 mars 2025)</td><td>Gouvernement du Canada</td></tr></tbody></table>"}, {"t": "3. Feuillets et relevés", "h": "<p>La plupart des revenus ont un feuillet fédéral (T) et un relevé du Québec (RL), mais pas tous (T4E sans relevé, RL-6 et RL-31 sans feuillet) : pour chaque type de revenu, vérifier les feuillets et relevés applicables.</p>\n<table><thead><tr><th>Revenu ou dépense</th><th>Fédéral</th><th>Québec</th></tr></thead><tbody><tr><td>Salaire</td><td>T4</td><td>RL-1</td></tr><tr><td>Intérêts, dividendes</td><td>T5</td><td>RL-3</td></tr><tr><td>Revenus d'une fiducie ou d'un fonds commun</td><td>T3</td><td>RL-16</td></tr><tr><td>Vente de titres</td><td>T5008</td><td>RL-18</td></tr><tr><td>Prestations d'assurance-emploi</td><td>T4E</td><td>—</td></tr><tr><td>Prestations du RQAP</td><td>—</td><td>RL-6</td></tr><tr><td>Frais de scolarité</td><td>T2202</td><td>RL-8</td></tr><tr><td>Frais de garde d'enfants</td><td>Reçus</td><td>RL-24</td></tr><tr><td>Logement au 31 décembre (crédit pour solidarité)</td><td>—</td><td>RL-31</td></tr></tbody></table>\n<p><strong>Méthode :</strong> avec la procuration du client, télécharger les feuillets déjà transmis aux deux administrations, puis les comparer avec les pièces du client et l'avis de cotisation de l'an dernier. Un feuillet présent l'an dernier et absent cette année est une question à poser. Attention : le coût indiqué sur le T5008 ou le RL-18 n'est pas toujours le PBR fiscal ; ne jamais le reprendre tel quel sans le reconstituer à partir des achats.</p>"}, {"t": "4. Le calcul, dans l'ordre", "h": "<ol><li><p>Revenu total : emploi, placements, gains en capital imposables, location, entreprise, prestations.</p></li><li><p>Déductions : REER, cotisations syndicales et professionnelles, pension alimentaire déductible, frais de garde (déduction au fédéral seulement).</p></li><li><p>Revenu net, puis revenu imposable.</p></li><li><p>Impôt selon les tranches, moins les crédits non remboursables (montant personnel de base, dons, frais médicaux, cotisations RRQ, RQAP et AE).</p></li><li><p>Au fédéral, abattement du Québec de 16,5 %.</p></li><li><p>Crédits remboursables, moins l'impôt déjà retenu : solde à payer ou remboursement.</p></li></ol>\n<p><strong>Particularités du Québec à connaître :</strong> les frais de garde donnent un <strong>crédit remboursable</strong> au Québec (RL-24), alors qu'ils sont une <strong>déduction</strong> au fédéral ; nouveauté 2026 : au Québec, l'enfant doit avoir moins de 14 ans (au lieu de moins de 16 ans), sauf en cas d'infirmité ; la déduction pour travailleur n'existe qu'au Québec ; le crédit pour solidarité se demande dans la TP-1 et exige le RL-31 ; la cotisation au régime public d'assurance médicaments se calcule dans la TP-1 pour les personnes qui n'ont pas d'assurance privée toute l'année.</p>"}, {"t": "5. Placements et gains en capital", "h": "<p>Gain en capital = produit de disposition − prix de base rajusté (PBR) − frais de vente. Pour 2026, la moitié du gain est imposable (taux d'inclusion de 50 %). Le PBR d'un fonds ou d'actions achetés en plusieurs fois est une moyenne : le courtier ne le fournit pas toujours correctement, et il faut le demander au client.</p>\n<p><strong>Piège :</strong> la vente de la résidence principale est généralement exonérée, mais elle <strong>doit être déclarée</strong> avec la désignation de résidence principale, au fédéral comme au Québec. Si une partie du logement a été louée, si de la DPA a été demandée ou si l'usage a changé, une partie du gain peut être imposable. La ressource déclare la vente, rassemble les faits (années d'occupation, partie louée, DPA passée) et signale le dossier au CPA : la désignation est un choix fiscal.</p>"}, {"t": "6. Revenus de location", "h": "<p>Formulaire T776 au fédéral, TP-128 au Québec. On déduit les dépenses courantes (intérêts hypothécaires, taxes municipales, assurances, entretien) ; les améliorations sont des immobilisations. La déduction pour amortissement (DPA) ne peut pas créer ni augmenter une perte de location : elle est limitée au revenu net de location avant DPA de l'ensemble des immeubles locatifs du contribuable, et non immeuble par immeuble. Un propriétaire doit aussi produire un RL-31 pour chaque logement admissible loué pour lequel un loyer était payé ou payable le 31 décembre.</p>"}, {"t": "7. Travailleur autonome", "h": "<p>Formulaire T2125 au fédéral, TP-80 au Québec. Revenus et dépenses d'entreprise ; usage mixte (auto, bureau à domicile) au prorata documenté. Le travailleur autonome paie les deux parts de la cotisation RRQ et une cotisation RQAP de travailleur autonome ; le logiciel les calcule. Il peut devoir verser des acomptes provisionnels l'année suivante.</p>\n<p><strong>Réflexe tunisien → Pratique québécoise :</strong> confondre un revenu de location et un revenu d'entreprise. Un loyer n'est pas un revenu d'entreprise : il ne donne pas droit au délai du 15 juin.</p>"}, {"t": "8. Échéances de la saison 2027 (année d'imposition 2026)", "h": "<table><thead><tr><th>Élément</th><th>Date</th></tr></thead><tbody><tr><td>Dernière cotisation REER déductible pour 2026</td><td>Lundi 1er mars 2027 (60e jour de 2027)</td></tr><tr><td>Production et paiement, cas général</td><td>Vendredi 30 avril 2027</td></tr><tr><td>Production si le particulier ou son conjoint exploite une entreprise</td><td>Mardi 15 juin 2027, mais le solde reste dû le 30 avril 2027</td></tr></tbody></table>"}, {"t": "9. Frontière ressource / CPA", "h": "<table><thead><tr><th>La ressource</th><th>Le CPA</th></tr></thead><tbody><tr><td>Rassemble et rapproche les feuillets, saisit les déclarations</td><td>Détermine le statut de résidence (arrivée ou départ du Canada)</td></tr><tr><td>Prépare la liste des pièces manquantes et des questions</td><td>Décide des choix : résidence principale, fractionnement du revenu de pension, report de pertes</td></tr><tr><td>Calcule les gains, la location, l'entreprise à partir des pièces</td><td>Traite les déclarations en retard, les biens étrangers et les divulgations volontaires</td></tr><tr><td>Prépare les formulaires d'autorisation de transmission (T183, TP-1000.TE)</td><td>Revoit, fait signer le client et autorise la transmission</td></tr></tbody></table>"}, {"t": "9 bis. Check-list de fin de dossier T1/TP-1", "h": "<p>Avant de remettre un dossier au CPA, la ressource coche chaque ligne ou note pourquoi elle ne s'applique pas.</p>\n<ul><li><p> Avis de cotisation de l'an dernier lu : solde impayé, report de pertes, droits REER, montants reportés.</p></li><li><p> Coordonnées, état civil au 31 décembre, personnes à charge et changements de l'année (naissance, séparation, déménagement, arrivée ou départ du Canada).</p></li><li><p> Feuillets et relevés téléchargés et comparés avec l'an dernier ; chaque absence expliquée.</p></li><li><p> Ventes de titres : PBR reconstitué, pas repris du T5008 sans vérification.</p></li><li><p> Immeubles : location (T776, TP-128), usage mixte, vente ou changement d'usage signalés.</p></li><li><p> RL-31 présent lorsque le client est admissible au crédit pour solidarité et que le relevé s'applique.</p></li><li><p> Frais de garde : âge des enfants (moins de 16 ans au fédéral, moins de 14 ans au Québec en 2026), qui réclame, reçus et RL-24.</p></li><li><p> REER (reçus des 60 premiers jours), dons, frais médicaux totalisés par période.</p></li><li><p> Revenus et biens à l'étranger : signalés au CPA.</p></li><li><p> Liste de questions au client et au CPA, avec une date de retour.</p></li></ul>"}, {"t": "9 ter. Frais de garde d'enfants : les règles du calcul", "h": "<p>Au fédéral, la déduction est en général demandée (des exceptions existent, notamment si ce conjoint est aux études, incarcéré ou dans d'autres situations prévues par les règles fiscales) par le conjoint qui a le <strong>revenu net le moins élevé</strong>. Elle est limitée au moins élevé de trois montants : les frais payés ; le total des montants par enfant (8 000 $ par enfant de moins de 7 ans à la fin de l'année, 5 000 $ par enfant de 7 à 15 ans, 11 000 $ par enfant admissible au crédit pour personnes handicapées) ; les deux tiers du revenu gagné. Au Québec, le crédit remboursable a ses propres plafonds et, depuis 2026, ne vise que les enfants de moins de 14 ans (sauf infirmité).</p>"}, {"t": "Sources M7 (consultées le 28 septembre 2026)", "h": "<ul><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/current-year.html\" target=\"_blank\" rel=\"noopener\">ARC — Taux d'imposition fédéraux de l'année en cours</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/forms-publications/payroll/t4127-payroll-deductions-formulas/t4127-jan/t4127-jan-payroll-deductions-formulas-computer-programs.html\" target=\"_blank\" rel=\"noopener\">ARC — T4127, formules de calcul 2026 (montant personnel de base)</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/registered-plans-administrators/pspa/mp-rrsp-dpsp-tfsa-limits-ympe.html\" target=\"_blank\" rel=\"noopener\">ARC — Plafonds REER et CELI</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/important-dates-individuals/filing-dates-tax-return.html\" target=\"_blank\" rel=\"noopener\">ARC — Dates limites de production</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/citoyens/declaration-de-revenus/transmettre-votre-declaration-de-revenus/date-limite-pour-transmettre-votre-declaration/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Date limite de la déclaration</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/retenues-a-la-source-et-cotisations-de-lemployeur/employeur-principaux-changements-2026/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Principaux changements 2026 (tranches, montants, déduction pour travailleur)</a></p></li><li><p><a href=\"https://capsule.mdm.ca/annulation-de-laugmentation-proposee-du-taux-dinclusion-gains-capital/\" target=\"_blank\" rel=\"noopener\">Annulation de la hausse du taux d'inclusion des gains en capital</a></p></li></ul>\n<ul><li><p><a href=\"https://www.revenuquebec.ca/fr/citoyens/credits-dimpot/credit-dimpot-pour-frais-de-garde-denfants/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Crédit d'impôt pour frais de garde d'enfants (âge maximal de moins de 14 ans dès 2026)</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/rental-income/capital-cost-allowance-rental-property/much-capital-cost-allowance-you-claim.html\" target=\"_blank\" rel=\"noopener\">ARC — Montant de DPA pouvant être demandé (immeubles locatifs)</a></p></li></ul>\n<ul><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/technical-information/income-tax/income-tax-folios-index/series-1-individuals/folio-3-family-unit-issues/income-tax-folio-s1-f3-c1-child-care-expense-deduction.html\" target=\"_blank\" rel=\"noopener\">ARC — Folio S1-F3-C1, déduction pour frais de garde d'enfants (8 000 $, 5 000 $, 11 000 $, deux tiers du revenu gagné)</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/deductions-credits-expenses/line-21400-child-care-expenses/who-claim-deduction.html\" target=\"_blank\" rel=\"noopener\">ARC — Qui peut demander la déduction pour frais de garde</a></p></li></ul>"}], "m6": [{"t": "1. Ce qui change par rapport à la Tunisie", "h": "<p>Les PME québécoises appliquent en général les <strong>Normes comptables pour les entreprises à capital fermé (NCECF, Partie II du Manuel de CPA Canada)</strong> : pas de plan comptable imposé, pas de liasse fiscale unique. Les états financiers sont le plus souvent <strong>compilés</strong> par le cabinet selon la NCSC 4200 : le CPA ne fait ni audit ni examen. Les déclarations fiscales sont séparées des états financiers : une T2 à l'ARC et une CO-17 à Revenu Québec.</p>\n<p><strong>Réflexe tunisien → Pratique québécoise :</strong> chercher le plan comptable officiel et les états prévus par la loi. Ici, le plan de comptes est celui du client ; ce qui compte, c'est que chaque solde soit justifié par une pièce ou un rapprochement dans le dossier.</p>"}, {"t": "2. Le dossier de fin d'exercice que prépare la ressource", "h": "<ol><li><p>Balance de vérification avant et après ajustements.</p></li><li><p>Rapprochements : banque, cartes de crédit, marges, prêts (avec la partie courante).</p></li><li><p>Comptes clients : liste chronologique, créances douteuses à signaler.</p></li><li><p>Stocks : décompte du client au 31 décembre.</p></li><li><p>Charges payées d'avance et charges à payer (coupure des factures de janvier).</p></li><li><p>Paie : vacances acquises non versées, salaires à payer ; sommaire des DAS rapproché du grand livre.</p></li><li><p>Taxes : TPS et TVQ déclarées rapprochées avec le grand livre.</p></li><li><p>Immobilisations : registre, ajouts, cessions, amortissement comptable.</p></li><li><p>Compte de l'actionnaire, capital-actions, dividendes déclarés (résolution).</p></li><li><p>Liste des écritures proposées, chacune avec sa pièce, et liste de questions au CPA.</p></li></ol>"}, {"t": "3. NCSC 4200 du point de vue du préparateur", "h": "<p>Depuis les périodes closes à partir du 14 décembre 2021, la NCSC 4200 remplace l'ancien « avis au lecteur » par un <strong>rapport de mission de compilation</strong>. Les états compilés comprennent une note qui décrit la base de comptabilité appliquée. Le CPA doit comprendre l'entreprise, convenir des conditions de la mission avec la direction et ne pas associer son nom à une information qu'il sait fausse ou trompeuse.</p>\n<p><strong>Frontière ressource / CPA :</strong> la ressource compile et documente ; elle signale par écrit toute information qui semble fausse, trompeuse ou incomplète (dépôts non expliqués, dépenses personnelles, stocks sans décompte). Elle ne choisit pas la base de comptabilité, ne rédige pas le rapport et ne signe rien.</p>"}, {"t": "4. Écritures de fin d'exercice fréquentes", "h": "<p>Charges payées d'avance ; charges à payer ; vacances à payer ; amortissement comptable ; frais bancaires et intérêts non inscrits ; reclassement de la partie courante des emprunts ; dividendes déclarés ; impôts sur le revenu estimés (calculés ou validés par le CPA).</p>\n<p><strong>Piège :</strong> confondre l'amortissement comptable et la déduction pour amortissement (DPA). L'amortissement va dans les états financiers ; la DPA est fiscale et se calcule dans la déclaration. Les deux coexistent.</p>"}, {"t": "5. Le compte de l'actionnaire", "h": "<p>Un solde créditeur signifie que la société doit de l'argent à l'actionnaire. Un solde <strong>débiteur</strong> signifie que l'actionnaire doit de l'argent à la société. Un tel prêt peut être inclus dans le revenu de l'actionnaire : le résultat dépend de la date et de la nature de chaque avance, des remboursements, d'éventuelles séries de prêts et remboursements, et de plusieurs exceptions. Le solde au 31 décembre ne suffit pas pour conclure. La ressource détaille le compte et signale le solde ; le CPA décide du traitement (remboursement, salaire, dividende).</p>"}, {"t": "6. Notions T2 et CO-17", "h": "<table><thead><tr><th>Élément</th><th>Fédéral (T2)</th><th>Québec (CO-17)</th></tr></thead><tbody><tr><td>Production</td><td>6 mois après la fin de l'exercice</td><td>6 mois après la fin de l'exercice</td></tr><tr><td>Paiement du solde</td><td>2 mois ; 3 mois pour une SPCC qui remplit les conditions</td><td>2 mois</td></tr><tr><td>Taux, petite entreprise (premiers 500 000 $ admissibles)</td><td>9 %</td><td>3,2 % ; 2,2 % pour une année qui commence après le 29 avril 2026, sous conditions</td></tr><tr><td>Taux général</td><td>15 %</td><td>11,5 %</td></tr></tbody></table>\n<p>Les états financiers sont transposés selon l'Index général des renseignements financiers (IGRF). Annexes à connaître de la T2 : 1 (conciliation du revenu), 8 (DPA), 50 (actionnaires), 100 et 125 (bilan et résultats IGRF). La déduction pour petite entreprise du Québec a ses propres conditions, dont un critère d'heures rémunérées : sauf pour les secteurs primaire et manufacturier, la déduction complète exige au moins 5 500 heures rémunérées, elle diminue entre 5 500 et 5 000 heures et disparaît sous 5 000 heures. Au Québec, le solde d'impôt est dû 2 mois après la fin de l'année, même pour une SPCC. Le CPA confirme l'admissibilité.</p>\n<p><strong>Conciliation du bénéfice comptable au revenu fiscal (annexe 1), exemples fréquents et non exhaustifs :</strong> partir du bénéfice comptable ; ajouter l'amortissement comptable, 50 % des repas et divertissements, les amendes et pénalités, les impôts sur le revenu inscrits en charge ; déduire la DPA.</p>"}, {"t": "Sources M6 (consultées le 28 septembre 2026)", "h": "<ul><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/corporations/corporation-tax-rates.html\" target=\"_blank\" rel=\"noopener\">ARC — Taux d'impôt des sociétés</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/corporations/corporation-payments/paying-your-balance-corporation-tax/balance-day.html\" target=\"_blank\" rel=\"noopener\">ARC — Date d'exigibilité du solde</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/corporations/corporation-income-tax-return/when-file-your-corporation-income-tax-return.html\" target=\"_blank\" rel=\"noopener\">ARC — Quand produire la T2</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/entreprises/impots/impot-des-societes/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Impôt des sociétés (délais CO-17)</a></p></li><li><p><a href=\"https://www.revenuquebec.ca/fr/salle-de-presse/nouvelles-fiscales/details/2026-05-04/hausse-du-taux-de-la-deduction-pour-petite-entreprise/\" target=\"_blank\" rel=\"noopener\">Revenu Québec — Hausse du taux de la déduction pour petite entreprise (4 mai 2026)</a></p></li><li><p><a href=\"https://www.bdo.ca/fr-ca/insights/compilation-engagement-standard-explainer\" target=\"_blank\" rel=\"noopener\">BDO — Mieux maîtriser la NCSC 4200</a></p></li></ul>\n<ul><li><p><a href=\"https://cffp.recherche.usherbrooke.ca/wp-content/uploads/2024/11/r_2024-14_dpe.pdf\" target=\"_blank\" rel=\"noopener\">Source explicative : Chaire de recherche en fiscalité et en finances publiques (Université de Sherbrooke) — Regard sur la déduction pour petite entreprise</a></p></li><li><p><a href=\"https://www.canada.ca/en/revenue-agency/services/tax/technical-information/income-tax/income-tax-folios-index/series-3-property-investments-savings-plans/folio-1-shares-shareholders-security-transactions/income-tax-folio-s3-f1-c1-shareholder-loans-debts.html\" target=\"_blank\" rel=\"noopener\">ARC — Folio S3-F1-C1, prêts et dettes d'actionnaires</a></p></li></ul>\n<ul><li><p><a href=\"https://www.budget.finances.gouv.qc.ca/budget/outils/depenses-fiscales/fiches/fiche-210101.asp\" target=\"_blank\" rel=\"noopener\">Source officielle : ministère des Finances du Québec — Dépenses fiscales 2025, taux réduit d'imposition pour les petites entreprises (5 500 heures, réduction linéaire jusqu'à 5 000 heures)</a></p></li></ul>"}]};

/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;};
const parseNum=s=>{if(s==null)return NaN;s=String(s).replace(/[\s  $%]/g,"").replace(",",".");return s===""?NaN:Number(s);};
const fmt=x=>new Intl.NumberFormat("fr-CA",{minimumFractionDigits:0,maximumFractionDigits:2}).format(x);
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("fr-CA",{day:"numeric",month:"long",year:"numeric"})}catch(e){return iso}};
const isRight=(q,v)=>q.type==="num"?Math.abs(parseNum(v)-q.answer)<=q.tol+1e-9:q.type==="choice"?v===q.answer:null;
const allQ=ep=>ep.blocs.flatMap(b=>b.questions);

/* ---------- Envoi automatique de la progression ---------- */
let syncT=null;
function syncProgress(){
  clearTimeout(syncT);
  syncT=setTimeout(()=>{
    const i=S.p.ident;if(!ENDPOINT||!i.nom||!i.courriel)return;
    const ex={};const all=[...M4E.exercices,...M5E.exercices,...M6E.exercices,...M7E.exercices];
    all.forEach(e=>{const r=S.p.entrainement[e.id];if(r)ex[e.id]={titre:e.titre.replace(/ — .*/,"")+" ("+e.id.slice(0,2).toUpperCase()+")",t:r.t,best:r.best};});
    const errs={};Object.values(S.p.entrainement).forEach(r=>Object.entries(r.err||{}).forEach(([k,c])=>errs[k]=(errs[k]||0)+c));
    const comps=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,c])=>k+" ("+c+")").join(", ");
    const body=JSON.stringify({type:"progression",nom:i.nom,courriel:i.courriel,lu:{m4:readCount("m4"),m4tot:LECONS.m4.length,m5:readCount("m5"),m5tot:LECONS.m5.length,m6:readCount("m6"),m6tot:LECONS.m6.length,m7:readCount("m7"),m7tot:LECONS.m7.length},ex,exTotal:all.length,comps});
    try{if(navigator.sendBeacon&&navigator.sendBeacon(ENDPOINT,new Blob([body],{type:"text/plain;charset=utf-8"})))return;}catch(e){}
    try{fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body});}catch(e){}
  },2500);
}

    el("div",{class:"grid2"},el("label",{class:"field"},"Nom complet",nom),el("label",{class:"field"},"Courriel",mail)),
    el("div",{class:"row"},el("button",{class:"btn",onclick:()=>{const n=nom.value.trim(),m=mail.value.trim();if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){saved.textContent="Entrez votre nom et un courriel valide.";saved.className="small bad";return;}S.p.ident={nom:n,courriel:m};persist();syncProgress();saved.textContent="Enregistré sur cet appareil.";saved.className="small good";renderWho();}},"Enregistrer"),saved)));
  const certs=S.p.certifs||{};const tr=S.p.entrainement||{};

  [["test","Test d'entrée","test"],["m4c","Certification M4 · TPS/TVQ","m4"],["m5c","Certification M5 · Paie","m5"],["m6c","Certification M6 · Fin d'exercice","m6"],["m7c","Certification M7 · Particuliers","m7"]].forEach(([id,l,tab])=>{
    const c=certs[id];g.append(el("div",{class:"card stat"},el("div",{class:"head"},el("h3",{},l),c?el("span",{class:"pill ok"},"Soumis"):el("span",{class:"pill"},"À faire")),el("p",{class:"small muted",style:"margin:0"},c?"Préparé le "+fmtDate(c.soumis)+". Vérifiez que l'onglet Google a confirmé la réception.":"Pas encore commencée."),el("div",{},el("button",{class:"btn ghost",onclick:()=>{S.tab=tab;render();}},c?"Voir mes réponses":"Commencer"))));
  });
  v.append(g);
  v.append(el("div",{class:"card"},el("h3",{},"Leçons"),el("div",{class:"tbl"},el("table",{},el("thead",{},el("tr",{},el("th",{},"Module"),el("th",{},"Sections lues"))),el("tbody",{},[["m4","M4 · TPS/TVH et TVQ"],["m5","M5 · Paie et fin d'année"],["m6","M6 · Fin d'exercice et T2/CO-17"],["m7","M7 · Impôt des particuliers"]].map(([m,l])=>el("tr",{},el("td",{},el("a",{href:"#",onclick:e=>{e.preventDefault();S.tab=m;render();window.scrollTo({top:0});}},l)),el("td",{class:"n"},readCount(m)+" / "+LECONS[m].length))))))));
  const rows=[...M4E.exercices,...M5E.exercices,...M6E.exercices,...M7E.exercices].map(ex=>{const r=tr[ex.id];return el("tr",{},el("td",{},ex.titre),el("td",{class:"n"},r?String(r.t):"0"),el("td",{class:"n"},r?r.best+" %":"—"));});

const b64url=bytes=>{let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};

    try{const stream=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));const buf=new Uint8Array(await new Response(stream).arrayBuffer());return ENDPOINT+"?d="+b64url(buf);}catch(e){}
